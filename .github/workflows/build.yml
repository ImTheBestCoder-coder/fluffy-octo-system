name: Build webOS IPK
on:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Enabling caching speeds up future builds
          cache: 'npm'

      - name: Install Modern webOS CLI Tools
        # Replaced @lgwebos/cli with the official unified tools package
        run: npm install -g @webos-tools/cli

      - name: Package the App into IPK
        # Running via npx ensures the environment locates the 'ares' binary cleanly
        run: npx ares-package .

      - name: Create Automated Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StarsOS Browser Build ${{ github.run_number }}
          files: './*.ipk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
