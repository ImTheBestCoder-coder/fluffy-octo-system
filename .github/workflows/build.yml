name: Build webOS IPK
on:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Speeds up runs by restoring your node_modules automatically
          cache: 'npm'

      - name: Install Project Dependencies
        # Installs packages listed in package.json (including webos-tools)
        run: npm ci

      - name: Package the App into IPK
        # Safely calls the locally installed ares binary 
        run: npx ares-package .

      - name: Create Automated Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StarsOS Browser Build ${{ github.run_number }}
          files: './*.ipk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
