name: Build webOS IPK
on:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install webOS CLI Tools
        # 'sudo' is required for global npm installs on ubuntu-latest
        run: sudo npm install -g @lgwebos/cli

      - name: Package the App into IPK
        # Explicitly call the absolute path of the global binary
        run: /usr/local/bin/ares-package .

      - name: Create Automated Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StarsOS Browser Build ${{ github.run_number }}
          # Using a direct wildcard expression to target your file safely
          files: './*.ipk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
