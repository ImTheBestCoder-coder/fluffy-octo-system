name: Build webOS IPK
on:
  push:
    branches:
      - main
permissions:
  contents: write
  id-token: write # Required for secure GitHub Actions release verification

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          # Fallback check if package.json doesn't have it explicitly as devDependency
          if ! npx ares-package -V &>/dev/null; then
            npm install -g @webos-tools/cli
          fi

      - name: Build Web App
        # Add your compilation step here if you are using React/Svelte/Vite
        # e.g., run: npm run build
        run: echo "Skipping if pure HTML/JS app"

      - name: Package the App into IPK
        # Safely package the directory that holds your appinfo.json
        run: |
          if [ -d "dist" ]; then
            npx ares-package dist
          else
            npx ares-package .
          fi

      - name: Verify IPK File Generation
        # This debug step guarantees the file exists before attempting to release
        run: |
          ls -la *.ipk || (echo "ERROR: No .ipk file was generated! Check your appinfo.json location." && exit 1)

      - name: Create Automated Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StarsOS Browser Build ${{ github.run_number }}
          files: |
            *.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
