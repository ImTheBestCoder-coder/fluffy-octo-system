name: Build webOS IPK

on:
  push:
    branches:
      - main  # This means the robot runs every time you save changes to your main branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-with: 18

      - name: Install webOS CLI Tools
        run: npm install -g @lgwebos/cli

      - name: Package the App into IPK
        run: ares-package .

      - name: Create Automated Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StarsOS Browser Build ${{ github.run_number }}
          files: "*.ipk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
